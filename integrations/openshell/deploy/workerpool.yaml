# A microVM worker pool for OpenShell actors. The worker image must be built
# from the Substrate commit the cluster runs (ate-setup publish worker-images;
# named ateworker-microvm since Substrate 63a17a92, ateom-microvm before); an
# older image fails its capacity report. hack/install.sh substitutes the
# image, the replica count and the names from its environment.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: openshell-microvm-workerpool
  namespace: ate-env
  labels:
    # The template selects its pool by this label (ate-env manifest template
    # --workerpool). Since Substrate 0443aec3 the template names no sandbox
    # class; the selector keeps OpenShell actors on this microvm pool.
    ate-env/workerpool: openshell-microvm-workerpool
spec:
  replicas: 2
  sandboxClasses:
  - name: microvm
    configRef:
      name: microvm
  workerImage: gcr.io/gke-ai-eco-dev/ate-images-glottman/ateom-microvm@sha256:bcb94ea372cbb81695fafc4374fc9f6abcb7711f2c2beee8cab002bf899762d2
