# A minimal OpenShell sandbox policy for `openshell sandbox create --policy`:
# the workspace is writable and one HTTPS endpoint is allowed read-only.
# Inside the sandbox, example.com resolves to a policy-DNS address and every
# other name is staged for review. The actor's own EgressPolicy still has to
# allow the host before a connection goes through (see the README).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: []
  read_write: []
network_policies:
  example:
    name: example-com
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
