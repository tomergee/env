syntax = "proto3";

package openshell.options.v1;

import "google/protobuf/descriptor.proto";

// Per-method authorization rule. Consumed at runtime by the gateway's
// descriptor-pool-based auth table to enforce auth mode, role, and scope.
message AuthorizationRule {
  // Authentication mode: "bearer", "sandbox", "dual", "peer", "operator",
  // or "unauthenticated". Operator requires a verified mTLS operator certificate.
  string auth_mode = 1;
  // Minimum workspace-level role required (checked by handler via
  // authorize_workspace): "user" or "admin". Mutually exclusive with
  // global_role.
  string workspace_role = 2;
  // Global role required (checked by middleware via OIDC claims):
  // "platform_admin". Mutually exclusive with workspace_role.
  string global_role = 3;
  // Required OIDC scope on the bearer path (e.g. "sandbox:read").
  string scope = 4;
}

// The upstream file also extends google.protobuf.MethodOptions with
// `AuthorizationRule authorization = 50000`. That block is left out of this
// copy: go.ate.dev/substrate registers `ateapi.method` on MethodOptions with
// the same number, Go's protobuf registry refuses two extensions with one
// number in a binary, and the compute-driver contract does not use the
// option. Only `secret` below is used.

// Marks a protobuf field whose value must not cross generic observation or
// extension boundaries such as gateway interceptors.
extend google.protobuf.FieldOptions {
  bool secret = 50001;
}
